services:
  postgres:
    image: postgres:16-alpine
    container_name: wholesale-postgres
    environment:
      POSTGRES_DB: wholesale_dev
      POSTGRES_USER: wholesale
      POSTGRES_PASSWORD: wholesale_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wholesale -d wholesale_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  seq:
    image: datalust/seq:latest
    container_name: wholesale-seq
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data

volumes:
  postgres_data:
  seq_data:
