services:
  postgres:
    image: postgres:16-alpine
    container_name: wholesale-postgres
    restart: always
    environment:
      POSTGRES_DB: wholesale_dev
      POSTGRES_USER: wholesale
      POSTGRES_PASSWORD: wholesale_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wholesale -d wholesale_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  seq:
    image: datalust/seq:latest
    container_name: wholesale-seq
    restart: always
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data

  api:
    image: wholesale-api:latest
    container_name: wholesale-api
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5100:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=wholesale_dev;Username=wholesale;Password=wholesale_pass"
      Jwt__Secret: "${JWT_SECRET:-change-me-in-production-must-be-32chars!}"
      Jwt__Issuer: "wholesale-api"
      Jwt__Audience: "wholesale-clients"
      Jwt__AccessTokenMinutes: "60"
      Jwt__RefreshTokenDays: "30"
      Seq__ServerUrl: "http://seq:80"
      Serilog__MinimumLevel__Default: "Information"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
  seq_data:
