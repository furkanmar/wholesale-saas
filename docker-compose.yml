services:
  postgres:
    image: postgres:16-alpine
    container_name: wholesale-postgres
    restart: always
    environment:
      POSTGRES_DB: wholesale_dev
      POSTGRES_USER: wholesale
      POSTGRES_PASSWORD: wholesale_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wholesale -d wholesale_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  seq:
    image: datalust/seq:latest
    container_name: wholesale-seq
    restart: always
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "5341:80"
    volumes:
      - seq_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wholesale-api
    restart: always
    ports:
      - "5100:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=wholesale_dev;Username=wholesale;Password=wholesale_pass
      - Jwt__Secret=dev-secret-key-minimum-32-characters-long!
      - Jwt__Issuer=wholesale-api
      - Jwt__Audience=wholesale-clients
      - Jwt__AccessTokenMinutes=60
      - Seq__ServerUrl=http://seq:80

volumes:
  postgres_data:
  seq_data:
